<div class="w-fit-content">
    <div class="card shadow-lg border-0">
        <div class="card-body p-5">
            <h2 class="text-center fw-bold text-dark">Login</h2>
            <p class="text-center text-muted mb-4">Enter your credentials to access your account</p>
            <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
                <fieldset class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg" 
                        id="username" 
                        name="username"
                        required
                        placeholder="Enter your username"
                        [(ngModel)]="credentials.username"
                        #username="ngModel"
                        [class.error]="username.errors && (username.dirty || username.touched)"
                    >
                </fieldset>
                <fieldset class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg" 
                        id="password" 
                        name="password"
                        required
                        placeholder="Enter your password"
                        [(ngModel)]="credentials.password"
                        #password="ngModel"
                        [class.error]="password.errors && (password.dirty || password.touched)"
                    >
                </fieldset>
                @if (errorMsg()) {
                    <p class="alert alert-danger py-2 mt-2">{{ errorMsg() }}</p>
                }

                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3" [disabled]="loginForm.invalid">{{loading() ? 'Logging in...' : 'Login'}}</button>

                <a href="#" class="text-decoration-none d-block w-fit-content mx-auto" [routerLink]="['/register']">Don't have an account?</a>
            </form>
        </div>
    </div>
</div>
