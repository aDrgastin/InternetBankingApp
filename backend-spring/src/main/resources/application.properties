spring.application.name=backend-spring
server.port=8081
server.servlet.context-path=/api

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.flywaydb=DEBUG
logging.level.org.flywaydb.core.internal.sqlscript.SqlScript=DEBUG

# Error handling
spring.mvc.problemdetails.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/banking_spring
spring.datasource.username=root
spring.datasource.password=root

#Flyway
spring.flyway.enabled=true

# Business
banking.card.bin=440000
banking.card.account-length=9
banking.card.validity-months=60
banking.account.country-code=HR
banking.account.bank-code=1234567
banking.account.account-length=10
